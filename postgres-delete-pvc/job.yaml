kind: Job
apiVersion: batch/v1
metadata:
  name: delete-pvc-failback
  namespace: kube-system
  labels:
    app: delete-pvc-failback
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: delete-pvc-failback
    spec:
      containers:
        - name: deletepvc
          image: "redhat-regisry.fed.local:8443/ose-cli"
          command:
            - "/bin/bash"
            - "-c"
            - "oc delete pvc --all -n postgres & oc get pvc -n postgres -o jsonpath='{.items[*].metadata.name}' | xargs -I {} oc patch pvc {} -n postgres --type=merge -p '{"metadata":{"finalizers":null}}'"
      restartPolicy: "Never"
      terminationGracePeriodSeconds: 30
      activeDeadlineSeconds: 500
      dnsPolicy: "ClusterFirst"
      serviceAccountName: "pxbackup-sa"
      serviceAccount: "pxbackup-sa"
